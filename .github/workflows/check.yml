name: VPN Gate Node Check

on:
  schedule:
    # 每天一次: 20:00 UTC = 北京时间 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN || 'https://checksocks5.qxlsyzf.workers.dev/check?sstp=vpn:vpn@' }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "90"
          # 只保留这些国家的节点 (ISO 两位码, 逗号分隔; 留空 = 全部保留)
          ALLOW_COUNTRIES: "JP,US"
          # 只要住宅节点, 丢弃机房 (1 = 开启; 留空 = 住宅+机房都要)
          ALLOW_RESIDENTIAL: "1"

      - name: Commit results into repo (raw.githubusercontent 直读, 不依赖 Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public
          if git diff --cached --quiet; then
            echo "结果无变化, 跳过提交"
          else
            git commit -m "chore: refresh node results $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

      - name: Show result URL
        run: 'echo "nodes.txt: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/public/nodes.txt"'
